name = "Monokai"
base = "dark"

[colors]
background = "#272822"
foreground = "#f8f8f2"
surface = "#1e1f1c"
elevated = "#34352f"
workspace = "#1e1f1c"
muted = "#90908a"
border = "#414339"
accent = "#99947c"
selection = "#878b9180"
selected_background = "#878b9180"
selected_foreground = "#f8f8f2"
current_line = "#3e3d32"
minimap_viewport = "#878b9125"
minimap_border = "#878b9180"
error = "#f92672"
warning = "#e6db74"

[syntax]
comment = "#88846f"
string = "#e6db74"
constant = "#ae81ff"
number = "#ae81ff"
keyword = "#f92672"
function = "#a6e22e"
type = "#a6e22e"
tag = "#f92672"

[[syntax_rules]]
scope = "storage.type, support.type, support.class, support.function, support.constant"
color = "#66d9ef"

[[syntax_rules]]
scope = "variable.parameter"
color = "#fd971f"

[terminal]
cursor = "#f8f8f0"
black = "#272822"
red = "#f92672"
green = "#a6e22e"
yellow = "#e6db74"
blue = "#66d9ef"
magenta = "#ae81ff"
cyan = "#a1efe4"
white = "#f8f8f2"
bright_black = "#75715e"
bright_red = "#ff5995"
bright_green = "#b6e85c"
bright_yellow = "#f0e69a"
bright_blue = "#8be3f4"
bright_magenta = "#c3a1ff"
bright_cyan = "#b9f4ec"
bright_white = "#ffffff"
