[extension]
id = "example.text-tools"
name = "Text Tools"
version = "0.1.0"
api = 1
wasm = "extension.wasm"

[[contributes.commands]]
id = "text-tools.sort-lines"
title = "Sort Lines"

[[contributes.commands]]
id = "text-tools.unique-lines"
title = "Remove Duplicate Lines"

[[contributes.commands]]
id = "text-tools.reverse-lines"
title = "Reverse Lines"

[[contributes.commands]]
id = "text-tools.trim-trailing"
title = "Trim Trailing Whitespace"

# JSON files are formatted by Code: Format Document (see `formatters` below).
# This command is for JSON embedded in other files.
[[contributes.commands]]
id = "text-tools.json-format-selection"
title = "Format Selection as JSON"

[[contributes.commands]]
id = "text-tools.json-minify"
title = "Minify JSON"

[[contributes.commands]]
id = "text-tools.case-upper"
title = "Convert to UPPER CASE"

[[contributes.commands]]
id = "text-tools.case-lower"
title = "Convert to lower case"

[[contributes.commands]]
id = "text-tools.case-title"
title = "Convert to Title Case"

[[contributes.commands]]
id = "text-tools.case-snake"
title = "Convert to snake_case"

[[contributes.commands]]
id = "text-tools.case-constant"
title = "Convert to CONSTANT_CASE"

[[contributes.commands]]
id = "text-tools.case-camel"
title = "Convert to camelCase"

[[contributes.commands]]
id = "text-tools.case-pascal"
title = "Convert to PascalCase"

[[contributes.commands]]
id = "text-tools.case-kebab"
title = "Convert to kebab-case"

[[contributes.commands]]
id = "text-tools.base64-encode"
title = "Base64 Encode"

[[contributes.commands]]
id = "text-tools.base64-decode"
title = "Base64 Decode"

[[contributes.commands]]
id = "text-tools.url-encode"
title = "URL Encode"

[[contributes.commands]]
id = "text-tools.url-decode"
title = "URL Decode"

[[contributes.commands]]
id = "text-tools.count"
title = "Count Lines, Words and Characters"

# Format Document and format-on-save use this for JSON files.
[[contributes.formatters]]
languages = ["json"]

[[contributes.keybindings]]
command = "text-tools.sort-lines"
key = "Alt+Shift+S"

[[contributes.keybindings]]
command = "text-tools.unique-lines"
key = "Alt+Shift+D"

[[contributes.keybindings]]
command = "text-tools.case-upper"
key = "Alt+Shift+U"

[[contributes.keybindings]]
command = "text-tools.case-lower"
key = "Alt+Shift+L"

[[contributes.keybindings]]
command = "text-tools.count"
key = "Alt+Shift+C"
