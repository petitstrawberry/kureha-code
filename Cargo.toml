[package]
name = "kureha-code"
version = "0.1.0"
edition = "2024"
description = "A cross-platform code editor built with ScarletUI"
license = "MIT"

[dependencies]
serde_json = "1"
toml = "0.8"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
floem-editor-core = { git = "https://github.com/lapce/floem", rev = "31fa8f444c37f4c314f47d88c23ffdbc25f2ab53" }

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-fs = { git = "https://github.com/petitstrawberry/Scarlet", rev = "4a7f67db9d35cacb6d2a05c21037394c6be739d0" }
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "9ddf4be60189ef8a02b7f307a906b5791535de6d", default-features = false, features = ["std", "platform-sws"] }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { git = "https://github.com/petitstrawberry/scarlet-ui", rev = "9ddf4be60189ef8a02b7f307a906b5791535de6d", default-features = false, features = ["std", "platform-winit"] }

[build-dependencies]
toml = "0.8"

[profile.release]
panic = "abort"
