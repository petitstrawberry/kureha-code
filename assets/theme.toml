# Save to apply. Invalid edits keep the last working theme.
name = "My Theme"
base = "kureha" # kureha, light, dark, dracula, monokai, nord, solarized-dark/light, gruvbox-dark, tokyo-night

[colors]
workspace = "#f5e3eb"
background = "#fffbfd"
foreground = "#463641"
elevated = "#fff7fb"
accent = "#c84c79"
selection = "#e8aec7b0"
# Also: surface, muted, border, current_line, error, warning,
# selected_background, selected_foreground (rows/tabs), minimap_viewport, minimap_border. Colors accept #RRGGBB or #RRGGBBAA.

[glass]
pane_opacity = 0.58
tab_opacity = 0.78
popup_opacity = 0.92
input_opacity = 0.78
blur_radius = 18.0

[syntax]
comment = "#877281"
keyword = "#aa3e78"
string = "#8b6243"
# Also: constant, number, function, type, tag.

# Optional TextMate scope overrides:
# [[syntax_rules]]
# scope = "entity.name.function"
# color = "#e1d396"

[code]
# Editor and terminal colors; independent from sidebar and tabs.
# theme = "tokyo-night"
font_size = 14.0
# font_family = "Menlo" # an installed family; default is bundled JetBrains Mono
# font_file = "/path/to/YourFont.ttf" # alternative to font_family, TTF or OTF
# background = "#1a1b26"
# foreground = "#c0caf5"
# selection = "#334466"
# current_line = "#24283b"

[terminal]
# Defaults follow the workbench theme. Optional overrides:
# background = "#fffbfd"
# foreground = "#463641"
# cursor = "#c84c79a6"
# red = "#b63b5e"
# Also: black, green, yellow, blue, magenta, cyan, white,
# and bright_black, bright_red, bright_green, bright_yellow,
# bright_blue, bright_magenta, bright_cyan, bright_white.
# 256-color slots 16–255 and explicit RGB colors are set by shell applications.
